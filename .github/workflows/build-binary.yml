# 构建 zread-pi standalone 二进制并发布 zip 产物
#
# 产物布局（wasm 必须与二进制同目录，运行时按可执行文件同目录查找，见
# packages/repo-analyzer/src/parser/wasm-loader.ts 与 apps/cli/src/commands/browse-server.ts）：
#   zread-pi-v<version>-<os>-<arch>.zip
#   ├── zread-pi(.exe)
#   ├── tree-sitter.wasm
#   ├── mappings.wasm
#   └── browse/          # 「浏览文档」前端静态资源
#
# 触发方式：
#   1. 推送 tag（v*）→ 构建并创建 Release，附上三个平台的 zip
#      正文：若仓库内存在 .github/release-notes/<tag>.md 就用它（人工编写的发布说明，正文与文件逐字一致）；
#            否则回落到 GitHub 自动生成的变更列表
#      注意：有说明文件时 `generate_release_notes` 必须为 false —— action 在两者同时开启时
#            会把自动生成的变更列表**追加**在说明文件后面。
#   2. workflow_dispatch → 手动构建，zip 上传到 workflow artifacts
name: build-binary

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # 全新 checkout 后无 node_modules，vendor:build / tsup 依赖安装后的依赖树
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # pi 内核 dist 产物不入库，必须先构建（顺序：telemetry → chord → ai → agent → tui）
      - name: Build vendor (pi dist)
        run: bun run vendor:build

      # workspace 包 exports 指向 dist/，按依赖顺序 tsup 构建
      - name: Build workspace packages (types → utils → repo-analyzer → orchestrator)
        shell: bash
        run: |
          set -e
          for pkg in types utils repo-analyzer orchestrator; do
            echo "building packages/$pkg"
            (cd "packages/$pkg" && bun run build)
          done

      # browse 前端静态资源（依赖随根 bun install 安装）
      - name: Build browse frontend
        run: bun run browse:build

      # CLI tsup 产物：dist/index.js + tree-sitter.wasm + mappings.wasm + dist/browse
      - name: Build CLI bundle
        run: cd apps/cli && bun run build

      - name: Compile binary + package zip
        run: bun run tools/build-binary.ts --target ${{ matrix.target }}

      - name: Smoke test binary
        shell: bash
        run: |
          cd dist-bin/zread-pi-v*-*/
          if [ -f zread-pi.exe ]; then ./zread-pi.exe --version; else ./zread-pi --version; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: zread-pi-${{ matrix.target }}
          path: dist-bin/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 发布说明文件需要 checkout 才能读到（release job 不跑构建，成本极低）
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist-bin

      # 仓库内准备了发布说明时用它作为 Release 正文（.github/release-notes/<tag>.md，与文件逐字一致），
      # 否则回落到自动生成的变更列表（生成开关也由这个 step 的结果决定，见 Create Release）。
      #
      # 注意：**不要**用 `body_path: ${{ hashFiles(...) != '' && ... || '' }}` ——
      # 表达式回路到空字符串时 GitHub 会把该输入整个过滤掉，等于没传 body_path，
      # 运行日志的 `with:` 里根本不出现该字段（v1.4.0 ~ v1.5.1 的正文因此一直是
      # 自动生成的 Full Changelog）。改用 shell 判断 + step 输出，未命中时输出空字符串。
      - name: Resolve release notes body
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "body_path=$file" >> "$GITHUB_OUTPUT"
            echo "using $file"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "no release notes file for ${GITHUB_REF_NAME}; falling back to generated notes"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*.zip
          # 只有在没有人工说明文件时才用自动生成的变更列表：
          # `generate_release_notes: true` 与 `body_path` 同时生效时，action 会把自动生成的
          # 变更列表**追加**在说明文件后面（v1.5.2 的正文就这样多了一段 Full Changelog）。
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          body_path: ${{ steps.notes.outputs.body_path }}
